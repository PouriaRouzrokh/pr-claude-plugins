<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" aria-hidden="true">
    <defs>
        <!-- Background Gradients -->
        <radialGradient id="bg-radial" cx="70%" cy="50%" r="80%" fx="80%" fy="50%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#0f172a" />
        </radialGradient>

        <radialGradient id="glow-highlight" cx="30%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.08" />
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
        </radialGradient>

        <!-- Wave Gradients (Fading out on the left) -->
        <linearGradient id="wave-grad-1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="20%" stop-color="#1e3a8a" stop-opacity="0" />
            <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.6" />
        </linearGradient>
        
        <linearGradient id="wave-grad-2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="30%" stop-color="#1e3a8a" stop-opacity="0" />
            <stop offset="70%" stop-color="#f0abfc" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
        </linearGradient>

        <!-- Central Orb and Node Gradients -->
        <radialGradient id="orb-core" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="20%" stop-color="#f0abfc" />
            <stop offset="70%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
        </radialGradient>

        <radialGradient id="orb-glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
            <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
        </radialGradient>

        <!-- Orbital Ring Gradients -->
        <linearGradient id="ring-grad-1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.5" />
        </linearGradient>

        <linearGradient id="ring-grad-2" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f0abfc" stop-opacity="0.8" />
            <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.5" />
        </linearGradient>

        <!-- Glassmorphism Styles -->
        <linearGradient id="glass-fill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
        </linearGradient>

        <linearGradient id="glass-border" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
            <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.3" />
        </linearGradient>

        <linearGradient id="sparkline-area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
        </linearGradient>

        <!-- Patterns & Filters -->
        <pattern id="dot-grid" width="30" height="30" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.5" fill="#1e3a8a" opacity="0.3" />
        </pattern>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <filter id="glow-intense" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur1" />
            <feGaussianBlur stdDeviation="10" result="blur2" />
            <feMerge>
                <feMergeNode in="blur2" />
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <style>
        /* CSS Animations */
        @keyframes svg-pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 0.2; }
        }
        @keyframes svg-dash {
            to { stroke-dashoffset: -40; }
        }
        @keyframes svg-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes svg-glow-cycle {
            0%, 100% { opacity: 0.3; transform: scale(0.95); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        @keyframes svg-fade-in {
            0% { opacity: 0; transform: translateY(15px); }
            40%, 60% { opacity: 1; transform: translateY(0px); }
            100% { opacity: 0; transform: translateY(-15px); }
        }
        @keyframes svg-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Animation Classes */
        .svg-pulse { animation: svg-pulse 3s infinite ease-in-out; }
        .svg-dash { animation: svg-dash 4s linear infinite; }
        .svg-float-1 { animation: svg-float 4.5s infinite ease-in-out; }
        .svg-float-2 { animation: svg-float 5.5s infinite ease-in-out 1s; }
        .svg-glow { animation: svg-glow-cycle 4s infinite ease-in-out; transform-origin: 850px 300px; }
        .svg-fade { animation: svg-fade-in 6s infinite ease-in-out; }
        .svg-spin { animation: svg-rotate 25s linear infinite; transform-origin: 850px 300px; }
        .svg-spin-reverse { animation: svg-rotate 35s linear infinite reverse; transform-origin: 850px 300px; }
        
        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transform: none !important; }
        }
    </style>

    <!-- Layer 1: Background & Grids -->
    <rect width="1200" height="600" fill="url(#bg-radial)" />
    <rect width="1200" height="600" fill="url(#dot-grid)" />
    <rect width="600" height="600" fill="url(#glow-highlight)" />

    <!-- Layer 2: Decorative Wave Patterns -->
    <g id="svg-wave-patterns">
        <path d="M-100,500 C 300,600 500,100 1300,200" fill="none" stroke="url(#wave-grad-1)" stroke-width="2" opacity="0.6" />
        <path d="M-100,400 C 400,250 700,550 1300,300" fill="none" stroke="url(#wave-grad-2)" stroke-width="4" opacity="0.4" filter="url(#glow)" />
        <path d="M-100,600 C 200,400 500,200 1300,50" fill="none" stroke="url(#wave-grad-1)" stroke-width="1" opacity="0.5" />
    </g>

    <!-- Layer 3: Network Graph Base (Solid Lines) -->
    <g id="svg-network-graph-base" stroke="#1e3a8a" stroke-width="1.5" opacity="0.5" fill="none">
        <!-- Center to nodes -->
        <path d="M850,300 L600,180 M850,300 L650,420 M850,300 L900,120 M850,300 L1050,220 M850,300 L1100,450 M850,300 L780,500 M850,300 L1000,380" />
        <!-- Node interconnections -->
        <path d="M600,180 L520,280 L650,420 L780,500 L1000,380 L1100,450" />
        <path d="M600,180 L900,120 L1050,220 L1000,380" />
    </g>

    <!-- Layer 4: Flowing Data Lines -->
    <g id="svg-network-data-lines">
        <g color="#06b6d4">
            <path d="M850,300 L600,180 L520,280 L650,420 L850,300" stroke="currentColor" stroke-width="2" stroke-dasharray="8 12" class="svg-dash" fill="none" stroke-linecap="round" filter="url(#glow)" />
            <path d="M650,420 L780,500 L1000,380 L1050,220" stroke="currentColor" stroke-width="2" stroke-dasharray="8 12" class="svg-dash" fill="none" stroke-linecap="round" style="animation-direction: reverse;" />
        </g>
        <g color="#f0abfc">
            <path d="M850,300 L900,120 L1050,220 L1100,450 L1000,380 L850,300" stroke="currentColor" stroke-width="2" stroke-dasharray="8 12" class="svg-dash" fill="none" stroke-linecap="round" style="animation-duration: 5s;" filter="url(#glow)" />
        </g>
    </g>

    <!-- Layer 5: Orbital Rings -->
    <g id="svg-orbital-rings">
        <g class="svg-spin">
            <circle cx="850" cy="300" r="180" fill="none" stroke="url(#ring-grad-1)" stroke-width="1.5" stroke-dasharray="100 40 20 40 10 30" />
            <circle cx="850" cy="300" r="180" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="2 300" stroke-linecap="round" filter="url(#glow)" />
            <!-- Small orbiting satellite -->
            <circle cx="1030" cy="300" r="4" fill="#06b6d4" filter="url(#glow)" />
        </g>
        <g class="svg-spin-reverse">
            <circle cx="850" cy="300" r="240" fill="none" stroke="url(#ring-grad-2)" stroke-width="1" stroke-dasharray="150 50 50 50" />
            <circle cx="850" cy="300" r="240" fill="none" stroke="#f0abfc" stroke-width="3" stroke-dasharray="1 400" stroke-linecap="round" filter="url(#glow)" />
            <!-- Small orbiting satellite -->
            <circle cx="850" cy="60" r="5" fill="#f0abfc" filter="url(#glow)" />
        </g>
    </g>

    <!-- Layer 6: Nodes and Central Orb -->
    <g id="svg-network-nodes">
        <!-- N1 -->
        <circle cx="600" cy="180" r="14" fill="none" stroke="#06b6d4" stroke-width="2" class="svg-pulse" style="transform-origin: 600px 180px; animation-delay: 0.1s;" />
        <circle cx="600" cy="180" r="5" fill="#06b6d4" />
        
        <!-- N2 -->
        <circle cx="650" cy="420" r="18" fill="none" stroke="#f0abfc" stroke-width="2" class="svg-pulse" style="transform-origin: 650px 420px; animation-delay: 0.4s;" />
        <circle cx="650" cy="420" r="6" fill="#f0abfc" />
        
        <!-- N3 -->
        <circle cx="900" cy="120" r="12" fill="none" stroke="#06b6d4" stroke-width="2" class="svg-pulse" style="transform-origin: 900px 120px; animation-delay: 0.7s;" />
        <circle cx="900" cy="120" r="4" fill="#06b6d4" />
        
        <!-- N4 -->
        <circle cx="1050" cy="220" r="16" fill="none" stroke="#f0abfc" stroke-width="2" class="svg-pulse" style="transform-origin: 1050px 220px; animation-delay: 1.0s;" />
        <circle cx="1050" cy="220" r="5" fill="#f0abfc" />
        
        <!-- N5 -->
        <circle cx="1100" cy="450" r="14" fill="none" stroke="#06b6d4" stroke-width="2" class="svg-pulse" style="transform-origin: 1100px 450px; animation-delay: 1.3s;" />
        <circle cx="1100" cy="450" r="4" fill="#06b6d4" />
        
        <!-- N6 -->
        <circle cx="780" cy="500" r="15" fill="none" stroke="#06b6d4" stroke-width="2" class="svg-pulse" style="transform-origin: 780px 500px; animation-delay: 1.6s;" />
        <circle cx="780" cy="500" r="5" fill="#06b6d4" />
        
        <!-- N7 -->
        <circle cx="1000" cy="380" r="18" fill="none" stroke="#f0abfc" stroke-width="2" class="svg-pulse" style="transform-origin: 1000px 380px; animation-delay: 1.9s;" />
        <circle cx="1000" cy="380" r="6" fill="#f0abfc" />
        
        <!-- N8 -->
        <circle cx="520" cy="280" r="12" fill="none" stroke="#f0abfc" stroke-width="2" class="svg-pulse" style="transform-origin: 520px 280px; animation-delay: 2.2s;" />
        <circle cx="520" cy="280" r="4" fill="#f0abfc" />

        <!-- Central Glowing Orb -->
        <g id="svg-central-orb">
            <circle cx="850" cy="300" r="120" fill="url(#orb-glow)" class="svg-glow" />
            <circle cx="850" cy="300" r="80" fill="url(#orb-glow)" class="svg-glow" style="animation-delay: -2s;" />
            <circle cx="850" cy="300" r="35" fill="url(#orb-core)" filter="url(#glow-intense)" />
        </g>
    </g>

    <!-- Layer 7: Floating Glassmorphic Cards -->
    <g id="svg-data-cards">
        <!-- Left Card (Bar Chart) -->
        <g class="svg-float-1">
            <rect x="420" y="80" width="180" height="120" rx="12" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.5" />
            <!-- Card Header -->
            <rect x="440" y="95" width="40" height="6" rx="3" fill="#06b6d4" opacity="0.8" />
            <circle cx="580" cy="98" r="4" fill="#f0abfc" opacity="0.6" />
            <!-- Chart Bars -->
            <rect x="440" y="120" width="140" height="6" rx="3" fill="#1e3a8a" opacity="0.5" />
            <rect x="440" y="120" width="80" height="6" rx="3" fill="#06b6d4" />
            
            <rect x="440" y="140" width="140" height="6" rx="3" fill="#1e3a8a" opacity="0.5" />
            <rect x="440" y="140" width="110" height="6" rx="3" fill="#f0abfc" />
            
            <rect x="440" y="160" width="140" height="6" rx="3" fill="#1e3a8a" opacity="0.5" />
            <rect x="440" y="160" width="50" height="6" rx="3" fill="#06b6d4" />
        </g>

        <!-- Right Card (Sparkline) -->
        <g class="svg-float-2">
            <rect x="940" y="400" width="220" height="130" rx="12" fill="url(#glass-fill)" stroke="url(#glass-border)" stroke-width="1.5" />
            <!-- Card Header -->
            <circle cx="965" cy="425" r="10" fill="url(#orb-core)" opacity="0.8" />
            <rect x="985" y="422" width="60" height="6" rx="3" fill="#f0abfc" opacity="0.8" />
            <rect x="1130" y="422" width="10" height="6" rx="3" fill="#06b6d4" opacity="0.5" />
            
            <!-- Sparkline Graphic -->
            <path d="M960,490 C 975,490 985,465 1000,465 C 1015,465 1025,485 1040,475 C 1055,465 1065,440 1080,450 C 1095,460 1105,435 1120,435 C 1130,435 1135,445 1140,445" fill="none" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
            <!-- Sparkline Area -->
            <path d="M960,490 C 975,490 985,465 1000,465 C 1015,465 1025,485 1040,475 C 1055,465 1065,440 1080,450 C 1095,460 1105,435 1120,435 C 1130,435 1135,445 1140,445 L1140,510 L960,510 Z" fill="url(#sparkline-area)" />
        </g>
    </g>

    <!-- Layer 8: Scattered Bokeh Particles -->
    <g id="svg-bokeh-particles">
        <g class="svg-fade" style="animation-delay: 0.2s;"><circle cx="380" cy="150" r="5" fill="#06b6d4" filter="url(#glow)" opacity="0.7"/></g>
        <g class="svg-fade" style="animation-delay: 1.5s;"><circle cx="350" cy="450" r="8" fill="#f0abfc" filter="url(#glow)" opacity="0.5"/></g>
        <g class="svg-fade" style="animation-delay: 0.8s;"><circle cx="750" cy="100" r="4" fill="#06b6d4" filter="url(#glow)" opacity="0.8"/></g>
        <g class="svg-fade" style="animation-delay: 3.2s;"><circle cx="1120" cy="80" r="10" fill="#1e3a8a" filter="url(#glow)" opacity="0.9"/></g>
        <g class="svg-fade" style="animation-delay: 2.1s;"><circle cx="1080" cy="520" r="6" fill="#f0abfc" filter="url(#glow)" opacity="0.6"/></g>
        <g class="svg-fade" style="animation-delay: 4.5s;"><circle cx="500" cy="550" r="7" fill="#06b6d4" filter="url(#glow)" opacity="0.5"/></g>
        <g class="svg-fade" style="animation-delay: 1.1s;"><circle cx="680" cy="280" r="3" fill="#ffffff" filter="url(#glow)" opacity="0.9"/></g>
        <g class="svg-fade" style="animation-delay: 2.8s;"><circle cx="950" cy="280" r="5" fill="#f0abfc" filter="url(#glow)" opacity="0.7"/></g>
        <g class="svg-fade" style="animation-delay: 3.9s;"><circle cx="820" cy="480" r="4" fill="#06b6d4" filter="url(#glow)" opacity="0.8"/></g>
        <g class="svg-fade" style="animation-delay: 0.5s;"><circle cx="1180" cy="300" r="12" fill="#1e3a8a" filter="url(#glow)" opacity="0.6"/></g>
    </g>
</svg>